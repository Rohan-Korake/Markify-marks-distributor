<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markify - Marks Distributor</title>
  <link rel="shortcut icon" href="./src/assets/logo.svg" type="image/x-icon" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link rel="stylesheet" href="src/output.css" />
</head>

<body class="min-h-screen overflow-x-hidden bg-slate-50 dark:bg-slate-950">
  <!-- Background Blur -->
  <div class="fixed inset-0 -z-10 overflow-hidden">
    <div class="absolute left-1/2 top-0 h-[450px] w-[450px] -translate-x-1/2 rounded-full bg-blue-500/10 blur-[120px]">
    </div>
    <div class="absolute bottom-0 right-0 h-[300px] w-[300px] rounded-full bg-violet-500/10 blur-[120px]"></div>
  </div>

  <!-- Main -->
  <main class="min-h-[90vh] flex items-center justify-center px-4 py-6">
    <!-- Main Card -->
    <div
      class="w-full max-w-sm sm:max-w-2xl lg:max-w-4xl rounded-[28px] sm:rounded-[32px] lg:rounded-[36px] border border-slate-200/70 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur-2xl shadow-[0_20px_80px_rgba(15,23,42,0.08)] dark:shadow-[0_20px_80px_rgba(0,0,0,0.5)] p-3 sm:p-8 lg:p-8">
      <div class="flex flex-col items-center text-center">
        <!-- Logo Image (no background) -->
        <div class="w-14 h-14 sm:w-16 sm:h-16 flex items-center justify-center cursor-pointer"
          onclick="location.reload()">
          <img src="./src/assets/logo.svg" alt="Markify Logo" class="w-full h-full object-contain" />
        </div>
        <h1 class="mt-5 text-3xl sm:text-4xl lg:text-5xl font-bold tracking-tight text-slate-900 dark:text-white">
          Markify
        </h1>
        <p class="mt-3 max-w-md text-sm sm:text-base text-slate-500 dark:text-slate-400">
          Calculate the perfect marks distribution effortlessly.
        </p>
      </div>

      <!-- Inputs -->
      <div class="mt-10 grid grid-cols-1 md:grid-cols-3 gap-5 lg:gap-6">
        <!-- Total Experiments -->
        <div>
          <label class="mb-2 block text-sm font-medium text-slate-700 dark:text-slate-300">
            Total Experiments
          </label>

          <input type="number" placeholder="Total Experiment" id="totalExperiment"
            class="w-full cursor-pointer rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-100/70 dark:bg-slate-800 px-4 py-3 text-sm sm:text-base text-slate-900 dark:text-white outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10" />
          <p id="totalExperimentError" class="ml-1 mt-1 text-sm text-red-500 hidden"></p>
        </div>

        <!-- Maximum Marks -->
        <div>
          <label class="mb-2 block text-sm font-medium text-slate-700 dark:text-slate-300">
            Maximum Marks
          </label>

          <input type="number" placeholder="Maximum Marks" id="maxMark"
            class="w-full cursor-pointer rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-100/70 dark:bg-slate-800 px-4 py-3 text-sm sm:text-base text-slate-900 dark:text-white outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10" />
          <p id="maxMarkError" class="ml-1 mt-1 text-sm text-red-500 hidden"></p>
        </div>

        <!-- Average Marks -->
        <div>
          <label class="mb-2 block text-sm font-medium text-slate-700 dark:text-slate-300">
            Average Marks
          </label>

          <input type="number" placeholder="Average Marks" id="avgMark"
            class="w-full cursor-pointer rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-100/70 dark:bg-slate-800 px-4 py-3 text-sm sm:text-base text-slate-900 dark:text-white outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10" />
          <p id="avgMarkError" class=" ml-1 mt-1 text-sm text-red-500 hidden"></p>
        </div>
      </div>

      <!-- Button -->
      <div class="mt-10 flex justify-center">
        <button id="distributeButton"
          class="w-full cursor-pointer sm:w-auto px-8 sm:px-20 py-3 md:w-full  rounded-2xl bg-gradient-to-r from-blue-600 via-indigo-600 to-violet-600 text-white text-sm sm:text-lg font-semibold shadow-lg shadow-blue-500/30 hover:-translate-y-1 hover:shadow-2xl hover:shadow-violet-500/20 transition-all duration-300">
          Distribute Marks
        </button>
      </div>

      <!-- Divider -->
      <div class="my-10 border-t border-slate-200 dark:border-slate-800"></div>

      <!-- Result -->
      <div id="resultsection">
        <h2 class="text-center text-xl sm:text-2xl font-bold text-slate-900 dark:text-white">
          Distribution Result
        </h2>

        <div class="mt-8 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 lg:gap-6">
          <!-- Low marks -->
          <div
            class="rounded-3xl border border-blue-100 dark:border-slate-700 bg-blue-50/80 dark:bg-slate-800 p-6 sm:p-8 text-center transition duration-300 hover:-translate-y-1 hover:shadow-lg">
            <h3 class="text-lg font-bold text-blue-600"><span id="lowMark">00</span> Marks</h3>
            <p id="lowMarkCount" class="mt-4 text-4xl sm:text-5xl font-bold text-slate-900 dark:text-white">00</p>
            <p class="mt-2 text-slate-500">times</p>
          </div>

          <!-- Mid marks -->
          <div
            class="rounded-3xl border border-emerald-100 dark:border-slate-700 bg-emerald-50/80 dark:bg-slate-800 p-6 sm:p-8 text-center transition duration-300 hover:-translate-y-1 hover:shadow-lg">
            <h3 class="text-lg font-bold text-emerald-600"><span id="midMark">00</span> Marks</h3>
            <p id="midMarkCount" class="mt-4 text-4xl sm:text-5xl font-bold text-slate-900 dark:text-white">00</p>
            <p class="mt-2 text-slate-500">times</p>
          </div>

          <!-- High marks -->
          <div
            class="rounded-3xl border border-violet-100 dark:border-slate-700 bg-violet-50/80 dark:bg-slate-800 p-6 sm:p-8 text-center transition duration-300 hover:-translate-y-1 hover:shadow-lg">
            <h3 class="text-lg font-bold text-violet-600"><span id="highMark">00</span> Marks</h3>
            <p id="highMarkCount" class="mt-4 text-4xl sm:text-5xl font-bold text-slate-900 dark:text-white">00</p>
            <p class="mt-2 text-slate-500">times</p>
          </div>
        </div>
      </div>

    </div>
  </main>

  <footer class="mt-1  flex justify-center pb-8">
    <div
      class="flex items-center gap-3 px-4 py-3 rounded-2xl bg-white/10 dark:bg-slate-900/40 backdrop-blur-xl border border-white/10 dark:border-white/10 shadow-lg shadow-black/10">

      <!-- LinkedIn -->
      <a href="https://www.linkedin.com/in/rohan-korake-720848342/"
        class="w-11 h-11 flex items-center justify-center rounded-xl
      border border-white/10 text-slate-400 hover:text-white hover:bg-blue-500/80 transition-all duration-300 hover:-translate-y-1">
        <i class="fa-brands fa-linkedin-in text-xl"></i>
      </a>

      <!-- GitHub -->
      <a href="https://github.com/Rohan-Korake"
        class="w-11 h-11 flex items-center justify-center rounded-xl
      border border-white/10 text-slate-400 hover:text-white hover:bg-cyan-500/80 transition-all duration-300 hover:-translate-y-1">
        <i class="fa-brands fa-github text-xl"></i>
      </a>

      <!-- Email -->
      <a href="mailto:rohannkorake@gmail.com"
        class="w-11 h-11 flex items-center justify-center rounded-xl
      border border-white/10 text-slate-400 hover:text-white hover:bg-emerald-500/80 transition-all duration-300 hover:-translate-y-1">
        <i class="fa-solid fa-envelope text-xl"></i>
      </a>

      <!-- Portfolio -->
      <a href="https://rohankorake.vercel.app" target="_blank"
        class="w-11 h-11 flex items-center justify-center rounded-xl
      border border-white/10 text-slate-400 hover:text-white hover:bg-violet-500/80 transition-all duration-300 hover:-translate-y-1">
        <i class="fa-solid fa-globe text-xl"></i>
      </a>

    </div>
  </footer>
</body>

<script src="src/scripts/main.js" type="module"></script>

</html>
