<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markify - Marks Distributor</title>
  <link rel="shortcut icon" href="./src/assets/logo.svg" type="image/x-icon" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link rel="stylesheet" href="src/output.css" />
</head>

<body class="min-h-screen overflow-x-hidden bg-slate-50 dark:bg-slate-950">

  <!-- Background Blur -->
  <div class="fixed inset-0 -z-10 overflow-hidden">
    <div class="absolute left-1/2 top-0 h-[450px] w-[450px] -translate-x-1/2 rounded-full bg-blue-500/10 blur-[120px]">
    </div>
    <div class="absolute bottom-0 right-0 h-[300px] w-[300px] rounded-full bg-violet-500/10 blur-[120px]"></div>
  </div>

  <!-- Main section -->
  <main class="min-h-[90vh] flex items-center justify-center px-4 py-6">
    <!-- Main Card -->
    <div
      class="w-full max-w-sm sm:max-w-2xl lg:max-w-4xl rounded-[28px] sm:rounded-[32px] lg:rounded-[36px] border border-slate-200/70 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur-2xl shadow-[0_20px_80px_rgba(15,23,42,0.08)] dark:shadow-[0_20px_80px_rgba(0,0,0,0.5)] p-3 sm:p-8 lg:py-4 lg:px-10">
      <div class="flex flex-col items-center text-center">
        <!-- Logo Image  -->
        <div class="w-14 h-14 sm:w-16 sm:h-16 flex items-center justify-center cursor-pointer"
          onclick="location.reload()">
          <img src="./src/assets/logo.svg" alt="Markify Logo" class="w-full h-full object-contain" />
        </div>
        <h1 class="mt-2 text-3xl sm:text-4xl lg:text-4xl font-bold tracking-tight text-slate-900 dark:text-white">
          Markify
        </h1>
        <p class="mt-2 max-w-md text-sm sm:text-base text-slate-500 dark:text-slate-400">
          Calculate the perfect marks distribution effortlessly.
        </p>
      </div>

      <!-- Inputs field container-->
      <div id="inputFieldContainer" class="mt-6 grid grid-cols-1 md:grid-cols-3 gap-5 lg:gap-6"></div>

      <!-- Button -->
      <div class="mt-6 flex justify-center">
        <button id="distributeButton"
          class="w-full cursor-pointer sm:w-auto px-8 sm:px-20 py-3 md:w-full  rounded-2xl bg-gradient-to-r from-blue-600 via-indigo-600 to-violet-600 text-white text-sm sm:text-lg font-semibold shadow-lg shadow-blue-500/30 hover:-translate-y-1 hover:shadow-2xl hover:shadow-violet-500/20 transition-all duration-300">
          Generate Distribution
        </button>
      </div>

      <!-- Divider -->
      <div class="my-10 border-t border-slate-200 dark:border-slate-800"></div>

      <!-- Result -->
      <div id="resultsection">
        <h2 class="text-center text-xl sm:text-2xl font-bold text-slate-900 dark:text-white">
          Distribution Result
        </h2>

        <!-- marks summary card container  -->
        <div id="summaryContainer" class="mt-6 max-w-4xl mx-auto grid grid-cols-1 sm:grid-cols-2 gap-5"> </div>

        <!-- marks distribution card container -->
        <div id="distributionCardContainer" class="mt-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 lg:gap-6">
        </div>
      </div>

      <!-- social link container -->
      <div class="mt-6  flex justify-center ">
        <div id="socialLinkContainer"
          class="flex items-center justify-center gap-6 px-4 py-3 rounded-2xl bg-white/10 dark:bg-slate-900/40 backdrop-blur-xl border border-white/10 dark:border-white/10 shadow-lg shadow-black/10">
        </div>
      </div>
    </div>
  </main>
</body>
<script src="src/scripts/main.js" type="module"></script>

</html>
